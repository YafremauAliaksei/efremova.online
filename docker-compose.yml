# ═══════════════════════════════════════════════════════════════════════════
#  Docker Compose — вся инфраструктура одной командой.
#
#  Запуск:    docker compose up -d
#  Остановка: docker compose down
#  Логи:      docker compose logs -f app
#
#  Ключевое решение по безопасности: наружу торчит ТОЛЬКО nginx.
#  База доступна исключительно внутри закрытой сети Docker —
#  из интернета к ней не подключиться в принципе.
# ═══════════════════════════════════════════════════════════════════════════

# Логи контейнеров: драйвер json-file по умолчанию копит их бесконечно,
# а в них бывают IP посетителей из сообщений об ошибках. Предел — 5 файлов
# по 10 МБ на сервис; старое вытесняется само (docs/03 п.11.2).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # ─────────────────────────── ПРИЛОЖЕНИЕ ───────────────────────────
  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    # Порт НЕ публикуется наружу: доступ только через nginx
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # ─── Ужесточение контейнера ───
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    read_only: true # файловую систему изменить нельзя
    tmpfs: [/tmp] # кроме временной папки в памяти
    cap_drop: [ALL] # снимаем все привилегии Linux
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1G }

  # ─────────────────────────── БАЗА ДАННЫХ ───────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Максимально строгая проверка пароля
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    # ⚠️ Порт наружу НЕ публикуется. Нужно подключиться с ноутбука —
    # только через SSH-туннель, никогда не открывая 5432 в интернет.
    expose: ['5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - ssl=off # внутри сети Docker трафик не выходит наружу
      - -c
      - log_connections=on # кто подключался — в аудит
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl # изменения схемы всегда в логах
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=100
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  # ─────────────────────────── NGINX ───────────────────────────
  # Единственный сервис, видимый из интернета
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./infra/nginx/cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      app: { condition: service_healthy }
    networks: [backend, frontend]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  # ─────────────────────────── SSL-СЕРТИФИКАТЫ ───────────────────────────
  # Обновляются автоматически каждые 12 часов. Let's Encrypt, бесплатно.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'
    logging: *default-logging
    networks: [backend]

  # ─────────────────────────── БЭКАПЫ ───────────────────────────
  # Ежедневно, зашифровано, в другую страну.
  # ⚠️ Бэкап без проверенного восстановления не считается бэкапом (docs/03)
  backup:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_SCHEDULE: '0 3 * * *'
      BACKUP_RETENTION_DAYS: '30'
      NGINX_LOG_RETENTION_DAYS: '14'
    # Логи nginx удаляет задача rotate-logs.sh этого же контейнера
    volumes:
      - nginx-logs:/logs/nginx
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

networks:
  # Внутренняя сеть: наружу выхода нет вообще
  backend:
    driver: bridge
    internal: false
  frontend:
    driver: bridge

volumes:
  postgres-data:
  certbot-certs:
  certbot-www:
  nginx-logs:
