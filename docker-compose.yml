# ═══════════════════════════════════════════════════════════════════════════
#  Docker Compose — вся инфраструктура одной командой.
#
#  Запуск:    docker compose up -d
#  Остановка: docker compose down
#  Логи:      docker compose logs -f app
#
#  Ключевое решение по безопасности: наружу торчит ТОЛЬКО nginx.
#  База доступна исключительно внутри закрытой сети Docker —
#  из интернета к ней не подключиться в принципе.
# ═══════════════════════════════════════════════════════════════════════════

# Логи контейнеров: драйвер json-file по умолчанию копит их бесконечно,
# а в них бывают IP посетителей из сообщений об ошибках. Предел — 5 файлов
# по 10 МБ на сервис; старое вытесняется само (docs/03 п.11.2).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # ─────────────────────────── ПРИЛОЖЕНИЕ ───────────────────────────
  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    # Порт НЕ публикуется наружу: доступ только через nginx
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # ─── Ужесточение контейнера ───
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    read_only: true # файловую систему изменить нельзя
    tmpfs: [/tmp] # кроме временной папки в памяти
    cap_drop: [ALL] # снимаем все привилегии Linux
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1G }

  # ─────────────────────────── БАЗА ДАННЫХ ───────────────────────────
  postgres:
    # Закреплён по хешу: тег можно перевесить на другой образ, хеш — нет.
    # Обновляет Dependabot (docker-compose), вместе с хешем.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Максимально строгая проверка пароля
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    # ⚠️ Порт наружу НЕ публикуется. Нужно подключиться с ноутбука —
    # только через SSH-туннель, никогда не открывая 5432 в интернет.
    expose: ['5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - ssl=off # внутри сети Docker трафик не выходит наружу
      - -c
      - log_connections=on # кто подключался — в аудит
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl # изменения схемы всегда в логах
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=100
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  # ─────────────────────────── NGINX ───────────────────────────
  # Наружу не открыт: на хосте ни одного порта. Запросы приходят только
  # из туннеля Cloudflare (сервис cloudflared ниже) по внутренней сети edge
  nginx:
    image: nginx:1.31-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      app: { condition: service_healthy }
    networks:
      backend: {}
      edge:
        ipv4_address: 172.30.0.3
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  # ─────────────────────────── ТУННЕЛЬ CLOUDFLARE ───────────────────────────
  # Единственный вход из интернета — и тот исходящий: cloudflared сам
  # подключается к Cloudflare, входящих портов на сервере нет вовсе.
  # Реальный IP сервера не виден, зайти «мимо Cloudflare» нельзя, TLS и
  # сертификаты — забота Cloudflare. Токен туннеля — из панели Cloudflare
  # (docs/15-server-runbook.md), хранится только в .env на сервере
  cloudflared:
    # Закреплён по хешу: :latest на боевом сервере — чужой код без проверки
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN не задан в .env}
    depends_on:
      nginx: { condition: service_healthy }
    networks:
      edge:
        ipv4_address: 172.30.0.2
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

  # ─────────────────────────── БЭКАПЫ ───────────────────────────
  # Ежедневно, зашифровано, в другую страну.
  # ⚠️ Бэкап без проверенного восстановления не считается бэкапом (docs/03)
  backup:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_SCHEDULE: '0 3 * * *'
      BACKUP_RETENTION_DAYS: '30'
      NGINX_LOG_RETENTION_DAYS: '14'
    # Логи nginx удаляет задача rotate-logs.sh этого же контейнера
    volumes:
      - nginx-logs:/logs/nginx
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    security_opt: [no-new-privileges:true]
    logging: *default-logging

networks:
  # Сеть сервисов. Не internal: приложению нужен исходящий доступ (курсы
  # валют, обложки YouTube). Входящего с хоста нет — портов не открыто
  backend:
    driver: bridge
    internal: false
  # Туннель ↔ nginx. Адреса фиксированы: nginx доверяет заголовку с IP
  # посетителя только от cloudflared (infra/nginx/nginx.conf, set_real_ip_from)
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/29

volumes:
  postgres-data:
  nginx-logs:
