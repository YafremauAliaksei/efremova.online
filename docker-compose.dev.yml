# ═══════════════════════════════════════════════════════════════════════════
#  ДОБАВКА ДЛЯ ЛОКАЛЬНОЙ РАЗРАБОТКИ
#
#  Применяется ПОВЕРХ docker-compose.yml и делает ровно одно:
#  открывает порт базы для программ, запущенных на вашем компьютере.
#
#  Запуск:
#    docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres
#  (то же самое короче:  npm run dev:db)
#
#  ⚠️ ПОЧЕМУ ЭТО ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ ПРАВКА ОСНОВНОГО
#
#  Запись "127.0.0.1:5432:5432" открывает порт только для этого компьютера.
#  Запись "5432:5432" открыла бы его ВСЕМУ ИНТЕРНЕТУ — и это причина №1
#  всех публичных утечек баз данных (docs/07-database-security.md, п.2.1).
#
#  Разница в девяти символах. Поэтому опасная настройка вынесена в отдельный
#  файл, который нужно подключить осознанно и который никогда не применяется
#  на сервере: там работает только docker-compose.yml.
# ═══════════════════════════════════════════════════════════════════════════

services:
  postgres:
    ports:
      # 127.0.0.1 = «только этот компьютер». Из локальной сети и из интернета
      # к порту не подключиться, даже зная пароль.
      - '127.0.0.1:5432:5432'

  # Приложение в контейнере — «как на сервере».
  #
  # В повседневной разработке оно НЕ нужно: `npm run dev` на самой машине
  # перезагружает страницу за доли секунды, а пересборка образа занимает минуты.
  # Контейнер нужен, чтобы проверить ровно то, что поедет на сервер:
  # ту же версию Node, те же права пользователя, ту же файловую систему
  # только для чтения.
  #
  # Запуск:  npm run stack:up      (остановка: npm run stack:down)
  app:
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      # Внутри сети Docker база доступна по имени сервиса, а не по localhost:
      # localhost в контейнере — это сам контейнер.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      APP_URL: http://localhost:3000
