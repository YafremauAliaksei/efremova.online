# ═══════════════════════════════════════════════════════════════════════════
#  NGINX — «привратник» перед приложением (docs/03-security-policy.md, рубеж №2)
#
#  Что он здесь делает:
#    1. Принимает HTTPS и расшифровывает TLS 1.3
#    2. Ограничивает частоту запросов (второй рубеж после Cloudflare)
#    3. Отбрасывает запросы, которые до приложения доходить не должны
#    4. Раздаёт статику напрямую с диска — быстрее, чем через Node.js
#
#  ⚠️ Принимает трафик ТОЛЬКО от Cloudflare: см. блок real_ip и firewall
#     в infra/terraform. Иначе заголовку CF-Connecting-IP доверять нельзя.
# ═══════════════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Прячем версию nginx: меньше подсказок атакующему ───
    server_tokens off;
    # Полное удаление заголовка Server требует модуля headers-more,
    # которого нет в стандартном образе nginx:alpine.
    # Включить вместе с brotli ниже (см. TODO в PROJECT_LOG, шаг 6.1).
    # more_clear_headers Server;

    # ─── Логи. Пишем страну от Cloudflare для анализа атак ───
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" cf_country="$http_cf_ipcountry" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main_ext buffer=32k flush=5s;

    # ─── Производительность передачи файлов ───
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # ─── Ограничения размера: защита от «раздувания» запроса ───
    client_max_body_size 10m;          # больше 10 МБ загружать некуда
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # ─── Таймауты: медленный клиент не должен держать соединение вечно ───
    # Это защита от атак Slowloris
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;
    reset_timedout_connection on;

    # ─── Сжатие. Brotli эффективнее gzip на 15-20 % ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml
               application/font-woff2 text/javascript;

    # Brotli сжимает на 15-20 % лучше gzip, но требует отдельного модуля,
    # которого нет в стандартном образе nginx:alpine.
    # ⚠️ На старте это не критично: Brotli уже применяет Cloudflare
    # (см. infra/terraform/cloudflare.tf, настройка brotli = "on").
    # Раскомментировать после перехода на образ с модулем (Sprint 6).
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript
    #              text/xml application/xml image/svg+xml;

    # ═══════════════════════════════════════════════════════════════════
    #  ЗОНЫ ОГРАНИЧЕНИЯ ЧАСТОТЫ ЗАПРОСОВ
    #
    #  Разные лимиты для разных зон — по принципу «что дороже, то строже».
    #  Вход и платежи атакуют чаще всего, там лимит самый жёсткий.
    # ═══════════════════════════════════════════════════════════════════
    limit_req_zone $binary_remote_addr zone=general:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m      rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/m;    # 5 в МИНУТУ
    limit_req_status 429;

    # Не более 20 одновременных соединений с одного IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn addr 20;
    limit_conn_status 429;

    # ═══════════════════════════════════════════════════════════════════
    #  ВОССТАНОВЛЕНИЕ РЕАЛЬНОГО IP ИЗ-ЗА CLOUDFLARE
    #
    #  Без этого в логах будет IP Cloudflare, а не клиента,
    #  и все лимиты станут бессмысленными.
    #  Список диапазонов обновляется скриптом раз в неделю (cron).
    # ═══════════════════════════════════════════════════════════════════
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ─── TLS: только современные протоколы ───
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;      # в TLS 1.3 выбор шифра доверяем клиенту
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;            # tickets ломают forward secrecy
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    upstream nextjs {
        server app:3000;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
}
