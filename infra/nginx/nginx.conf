# ═══════════════════════════════════════════════════════════════════════════
#  NGINX — «привратник» перед приложением (docs/03-security-policy.md, рубеж №2)
#
#  Что он здесь делает:
#    1. Ограничивает частоту запросов (второй рубеж после Cloudflare)
#    2. Отбрасывает запросы, которые до приложения доходить не должны
#    3. Восстанавливает реальный IP посетителя для лимитов и журнала
#
#  ⚠️ Принимает трафик ТОЛЬКО от cloudflared (туннель Cloudflare): портов на
#     хосте нет, а заголовку CF-Connecting-IP верим лишь с адреса cloudflared
#     (блок real_ip ниже). TLS снимает Cloudflare — здесь его нет.
# ═══════════════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Прячем версию nginx: меньше подсказок атакующему ───
    server_tokens off;
    # Полное удаление заголовка Server требует модуля headers-more,
    # которого нет в стандартном образе nginx:alpine.
    # Включить вместе с brotli ниже (см. TODO в PROJECT_LOG, шаг 6.1).
    # more_clear_headers Server;

    # ─── Логи. Пишем страну от Cloudflare для анализа атак ───
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" cf_country="$http_cf_ipcountry" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main_ext buffer=32k flush=5s;

    # ─── Производительность передачи файлов ───
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # ─── Ограничения размера: защита от «раздувания» запроса ───
    client_max_body_size 10m;          # больше 10 МБ загружать некуда
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # ─── Таймауты: медленный клиент не должен держать соединение вечно ───
    # Это защита от атак Slowloris
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;
    reset_timedout_connection on;

    # ─── Сжатие. Brotli эффективнее gzip на 15-20 % ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml
               application/font-woff2 text/javascript;

    # Brotli сжимает на 15-20 % лучше gzip, но требует отдельного модуля,
    # которого нет в стандартном образе nginx:alpine.
    # ⚠️ На старте это не критично: Brotli уже применяет Cloudflare
    # (см. infra/terraform/cloudflare.tf, настройка brotli = "on").
    # Раскомментировать после перехода на образ с модулем (Sprint 6).
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript
    #              text/xml application/xml image/svg+xml;

    # ═══════════════════════════════════════════════════════════════════
    #  ЗОНЫ ОГРАНИЧЕНИЯ ЧАСТОТЫ ЗАПРОСОВ
    #
    #  Разные лимиты для разных зон — по принципу «что дороже, то строже».
    #  Вход и платежи атакуют чаще всего, там лимит самый жёсткий.
    # ═══════════════════════════════════════════════════════════════════
    limit_req_zone $binary_remote_addr zone=general:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m      rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/m;    # 5 в МИНУТУ
    limit_req_status 429;

    # Не более 20 одновременных соединений с одного IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn addr 20;
    limit_conn_status 429;

    # ═══════════════════════════════════════════════════════════════════
    #  ВОССТАНОВЛЕНИЕ РЕАЛЬНОГО IP ПОСЕТИТЕЛЯ
    #
    #  Без этого в логах и лимитах был бы адрес cloudflared, а не клиента,
    #  и все лимиты стали бы бессмысленными. CF-Connecting-IP ставит сам
    #  Cloudflare; принимаем его ТОЛЬКО от cloudflared — его адрес
    #  фиксирован в docker-compose.yml (сеть edge). Остальным не верим.
    #  Списка IP Cloudflare больше нет: Cloudflare к nginx напрямую не ходит.
    # ═══════════════════════════════════════════════════════════════════
    set_real_ip_from 172.30.0.2/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    upstream nextjs {
        server app:3000;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
}
