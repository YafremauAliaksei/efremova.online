# ═══════════════════════════════════════════════════════════════════════════
#  Виртуальный хост efremova.online
#
#  Читается сверху вниз, поэтому порядок блоков location имеет значение:
#  сначала самые специфичные правила, потом общие.
# ═══════════════════════════════════════════════════════════════════════════

# ─── HTTP → HTTPS. Единственное назначение этого сервера ───
server {
    listen 80;
    listen [::]:80;
    server_name efremova.online www.efremova.online;

    # Проверка Let's Encrypt должна проходить по HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://efremova.online$request_uri;
    }
}

# ─── www → без www (канонический адрес один, иначе дубли в SEO) ───
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.efremova.online;

    ssl_certificate     /etc/letsencrypt/live/efremova.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/efremova.online/privkey.pem;

    return 301 https://efremova.online$request_uri;
}

# ─── Основной сервер ───
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name efremova.online;

    ssl_certificate     /etc/letsencrypt/live/efremova.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/efremova.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/efremova.online/chain.pem;

    # HSTS дублируется здесь на случай, если приложение не ответит:
    # заголовок должен быть даже на странице ошибки
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    limit_req zone=general burst=50 nodelay;

    # ═══════════════════════════════════════════════════════════════
    #  БЛОКИРОВКИ ДО ПРИЛОЖЕНИЯ
    #  Отсекаем на уровне nginx то, что не должно тратить ресурсы Node.js
    # ═══════════════════════════════════════════════════════════════

    # Обращение по IP вместо домена = почти всегда сканер
    if ($host !~* ^(efremova\.online|www\.efremova\.online)$) {
        return 444;   # 444 = разорвать соединение без ответа
    }

    # Экзотические HTTP-методы: TRACE используется в атаках Cross-Site Tracing
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Скрытые файлы: .env, .git, .htaccess — классическая цель сканеров.
    # ⚠️ Исключение для /.well-known/ — там живут ACME-проверки и security.txt
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        return 404;
    }

    # Исходники и бэкапы: если такой файл случайно окажется на сервере,
    # снаружи его всё равно не скачать
    location ~* \.(sql|bak|old|swp|zip|tar|gz|env|log|ini|conf|sh)$ {
        deny all;
        return 404;
    }

    # ═══════════════════════════════════════════════════════════════
    #  ЛОВУШКИ: пропускаем в приложение, где их обработает middleware
    #  (нам важно ЗАПИСАТЬ попытку, а не просто отбросить её)
    # ═══════════════════════════════════════════════════════════════
    location ~* ^/(wp-admin|wp-login|wp-content|xmlrpc\.php|phpmyadmin|adminer) {
        limit_req zone=auth burst=2 nodelay;
        proxy_pass http://nextjs;
        include /etc/nginx/proxy_params.conf;
    }

    # ═══════════════════════════════════════════════════════════════
    #  МАРШРУТЫ ПРИЛОЖЕНИЯ
    # ═══════════════════════════════════════════════════════════════

    # 🔒 Админка: никакого кэша и жёсткий лимит.
    #
    # Формы входа здесь нет — войти можно только по одноразовой ссылке
    # из терминала сервера, поэтому подбирать нечего. Лимит всё равно стоит:
    # он срезает шум от сканеров, которые перебирают /admin по словарю.
    location /admin {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://nextjs;
        include /etc/nginx/proxy_params.conf;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://nextjs;
        include /etc/nginx/proxy_params.conf;
        proxy_cache off;
    }

    # Статика Next.js: раздаём с диска, не беспокоя Node.js.
    # Имена файлов содержат хеш содержимого → можно кэшировать навсегда.
    location /_next/static/ {
        alias /app/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Всё остальное — в приложение
    location / {
        proxy_pass http://nextjs;
        include /etc/nginx/proxy_params.conf;
    }

    # Страницы ошибок не должны выдавать версии и пути
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
