# Общие параметры проксирования в Next.js.
# Вынесены отдельно, чтобы не повторять в каждом location и не разъехаться.

proxy_http_version 1.1;

# Заголовки, по которым приложение понимает, кто и откуда пришёл
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Посетитель всегда пришёл по HTTPS — к Cloudflare (Always Use HTTPS);
# до nginx запрос доходит по внутренней сети, где $scheme был бы http
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;

# Реальный IP — уже восстановленный nginx из CF-Connecting-IP cloudflared
# (nginx.conf, real_ip): подделанный заголовок посетителя сюда не доходит.
# Страна и Ray — как пришли: другого входа, кроме туннеля, нет
proxy_set_header CF-Connecting-IP $remote_addr;
proxy_set_header CF-IPCountry     $http_cf_ipcountry;
proxy_set_header CF-Ray           $http_cf_ray;

# Поддержка WebSocket (нужна для live-обновления статуса оплаты)
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";

# Таймауты: приложение, не ответившее за 10 секунд, считается зависшим
proxy_connect_timeout 5s;
proxy_send_timeout    10s;
proxy_read_timeout    10s;

proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 16 8k;
proxy_busy_buffers_size 16k;

# Не даём приложению «протечь» лишней информацией наружу
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
