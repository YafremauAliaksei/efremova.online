# Конфигурация gitleaks — поиск секретов в истории репозитория.
#
# Используются все стандартные правила (их больше сотни: ключи AWS, Stripe,
# GitHub, приватные ключи, токены облаков). Ниже — только точечные исключения.
#
# ⚠️ ПРИНЦИП: исключения максимально УЗКИЕ.
# У нас уже был случай, когда широкое правило «всё, где есть слово example»
# пропустило настоящий по виду ключ AWS (docs/06, п.4). Поэтому здесь
# перечислены конкретные строки, а не шаблоны вроде «весь каталог docs».

title = "efremova.online"

[extend]
useDefault = true

[allowlist]
description = "Точечные исключения: документация и код самих проверок"

regexes = [
  # Канонический пример ключа из документации AWS. Такого ключа не существует —
  # он опубликован самой AWS как образец. Встречается в docs/06 и в комментарии
  # к scripts/check-staged-secrets.mjs.
  '''AKIAIOSFODNN7EXAMPLE''',

  # Заглушки в .env.example: показывают, ЧТО нужно заполнить, а не значение
  '''CHANGE_ME[A-Za-z0-9_]*''',

  # Заведомо недействительные значения в пробах доступности провайдеров
  # (например, в тестовых окружениях CI)
  '''availability-probe-not-a-real-[a-z]+''',
  '''ci_only_not_a_real_secret_value_32ch''',
  '''ci_only_password''',
]

paths = [
  # Артефакты сборки и зависимости: в git не попадают, но локальный запуск
  # gitleaks без этого исключения тратит минуты на .next/cache
  '''^\.next/''',
  '''^node_modules/''',
  '''^coverage/''',
]
