# Автоматическое обновление зависимостей.
#
# ⚠️ ИСТОРИЯ ЭТОГО ФАЙЛА
# Первая версия открыла 17 pull request'ов за минуту и завалила почту письмами.
# Причина: группировка работала только для minor/patch, а каждое мажорное
# обновление (next 15→16, prisma 6→7, eslint 9→10) приходило отдельным PR
# и на каждый запускался полный конвейер CI.
#
# ПРИНЦИП НОВОЙ ВЕРСИИ
# Обновления безопасности приходят сразу и всегда — это их работа.
# Всё остальное приезжает одним PR в неделю, и мажорные версии не приезжают
# вообще: переход на новую мажорную версию фреймворка — это осознанное
# решение с проверкой, а не то, что стоит делать по уведомлению робота.
#
# Меток (labels) нет намеренно: тип обновления виден по префиксу заголовка
# (deps:, ci:, docker:), а метку, которой нет в репозитории, Dependabot
# не ставит и оставляет в каждом PR напоминание о ней.

version: 2
updates:
  # ──────────────────────── Библиотеки npm ────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Warsaw

    # Максимум два PR одновременно. Больше — это уже не помощь, а шум.
    open-pull-requests-limit: 2

    # Свежая версия отлёживается неделю. Большинство «сломанных» релизов
    # чинят патчем в первые дни — мы их просто не увидим.
    cooldown:
      default-days: 7

    # Всё минорное и патчи — одним pull request'ом
    groups:
      all-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

    # Мажорные версии Dependabot не предлагает.
    # ⚠️ Это НЕ значит «не обновляемся»: раз в квартал обновление мажорных
    # версий делается вручную, по одной, с прогоном npm run verify
    # (запись в PROJECT_LOG → Roadmap).
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

    commit-message:
      prefix: deps

  # ──────────────────────── GitHub Actions ────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # ──────────────────────── Базовые образы Docker ────────────────────────
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      all-images:
        patterns: ['*']
    # Node 22 — версия с долгой поддержкой (LTS). Переход на следующую LTS
    # делается осознанно, а не потому, что вышел новый номер.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: docker

  # ──────────────────────── Образы в docker-compose.yml ────────────────────────
  # certbot, nginx и postgres на боевом сервере закреплены по хешу
  # (CLAUDE.md, правило 11). Без этого блока хеш устарел бы навсегда:
  # Dependabot смотрел бы только Dockerfile в /infra/docker.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      all-compose-images:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: docker
